<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 60" width="260" height="60">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2B3FD4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A2BA8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c8d0f8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Fond arrondi -->
  <rect width="260" height="60" rx="14" fill="url(#bgGrad)" />

  <!-- Icône maison stylisée -->
  <!-- Toit -->
  <polygon points="18,28 34,14 50,28" fill="url(#roofGrad)" />
  <!-- Cheminée -->
  <rect x="40" y="16" width="5" height="8" rx="1" fill="white" opacity="0.7"/>
  <!-- Corps de la maison -->
  <rect x="21" y="28" width="26" height="18" rx="2" fill="white" opacity="0.95"/>
  <!-- Porte -->
  <rect x="30" y="36" width="8" height="10" rx="2" fill="url(#bgGrad)"/>
  <!-- Fenêtre gauche -->
  <rect x="24" y="31" width="5" height="5" rx="1" fill="url(#bgGrad)" opacity="0.8"/>
  <!-- Fenêtre droite -->
  <rect x="39" y="31" width="5" height="5" rx="1" fill="url(#bgGrad)" opacity="0.8"/>
  <!-- Point brillant sur le toit -->
  <circle cx="34" cy="14" r="2.5" fill="#F5C842"/>

  <!-- Texte "Immo" -->
  <text
    x="62" y="34"
    font-family="'DM Sans', 'Segoe UI', Arial, sans-serif"
    font-size="22"
    font-weight="700"
    fill="white"
    letter-spacing="0.5"
  >Immo</text>

  <!-- Texte "Premium" en or/jaune -->
  <text
    x="118" y="34"
    font-family="'DM Sans', 'Segoe UI', Arial, sans-serif"
    font-size="22"
    font-weight="700"
    fill="#F5C842"
    letter-spacing="0.5"
  >Premium</text>

  <!-- Ligne décorative sous le texte -->
  <rect x="62" y="40" width="182" height="2" rx="1" fill="white" opacity="0.15"/>

  <!-- Tagline -->
  <text
    x="62" y="52"
    font-family="'DM Sans', 'Segoe UI', Arial, sans-serif"
    font-size="8.5"
    font-weight="500"
    fill="white"
    opacity="0.6"
    letter-spacing="2"
  >VOTRE BIEN. NOTRE PRIORITÉ.</text>

</svg>
